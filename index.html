<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Configuración para iPhone PWA (Pantalla Completa) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Evolet Nails">

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=2">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png?v=2">

    <title>Evolet Nails - Sistema de Contabilidad</title>

    <!-- Google Fonts: Comfortaa (Redondeada Y2K) y Outfit (Moderna y legible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Optimización para evitar FOUC: preconnect y preloads -->
    <!-- Cargamos CSS principal de forma inmediata para evitar flashes de estilo -->
    <link rel="stylesheet" href="/style.css">
    <noscript>
        <link rel="stylesheet" href="/style.css">
    </noscript>

    <!-- Evitar destello de contenido: mostramos la app cuando los estilos estén listos -->
    <style>html{opacity:0;transition:opacity .18s ease-in}</style>
    <script>function __evolet_styles_ready(){document.documentElement.style.opacity='1'};window.addEventListener('load',__evolet_styles_ready);</script>
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <!-- Punto de montaje de React -->
    <div id="react-root"></div>
    <script type="module" src="/src/react-main.jsx"></script>
</body>

</html>
